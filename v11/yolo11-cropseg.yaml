# yolo11-cropseg.yaml

# SEBlock：用于增强特征表示；
# GrowthStageEmbedding：引入生育期向量信息；
# MultiScaleFusion：增强对不同飞行高度图像的处理能力。

nc: 1  # number of classes
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8

  - [-1, 1, SEBlock, []]  # 不再需要提供通道数参数
  - [-1, 1, GrowthStageEmbedding, [4, 8]]  # 5 - 生育期嵌入（4阶段, 8维度）

  - [-1, 1, Conv, [256, 3, 1]]        # 6 - 融合后继续卷积（通道保持）

  - [-1, 2, C3k2, [512, False, 0.25]] # 7
  - [-1, 1, Conv, [512, 3, 2]]        # 8-P4/16

  - [-1, 1, MultiScaleFusion, [128, 128]]
  - [-1, 2, C3k2, [512, True]]       # 10

  - [-1, 1, Conv, [1024, 3, 2]]      # 11-P5/32
  - [-1, 2, C3k2, [1024, True]]      # 12
  - [-1, 1, SPPF, [1024, 5]]         # 13
  - [-1, 2, C2PSA, [1024]]           # 14

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15
  - [[-1, 10], 1, MDFM, [256, 384]]                # 16: cat backbone P4
  - [-1, 2, C3k2, [512, False]]                    # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 18
  - [[-1, 7], 1, Concat, [1]]                      # 19: cat backbone P3
  - [-1, 2, C3k2, [256, False]]                    # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 17], 1, Concat, [1]]                     # 22: cat head P4
  - [-1, 2, C3k2, [512, False]]                    # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                     # 24
  - [[-1, 14], 1, Concat, [1]]                     # 25: cat head P5
  - [-1, 2, C3k2, [1024, True]]                    # 26 (P5/32-large)

  - [[20, 23, 26], 1, Segment, [nc, 32, 256]]      # 27: 输出分割结果
